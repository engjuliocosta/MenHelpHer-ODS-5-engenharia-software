services:
  menhelpher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menhelpher-app
    image: menhelpher:latest
    ports:
      - "8000:8000"
    environment:
      - MENHELPHER_HOST=0.0.0.0
      - MENHELPHER_PORT=8000
      - MENHELPHER_DB=/app/database/menhelpher.db
    volumes:
      - ./database:/app/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/saude"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
